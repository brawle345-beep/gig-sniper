# language: YAML, file: .github/workflows/sniper.yml
name: gig-sniper
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gig-sniper
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: poll
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          MIN_SCORE: "2"
          MAX_AGE_HOURS: "24"
        run: python gig-sniper.py
      - name: persist state
        run: |
          git config user.name "gig-sniper"
          git config user.email "gig-sniper@users.noreply.github.com"
          git add seen.json feed.json
          git diff --staged --quiet && exit 0
          git commit -m "state [skip ci]"
          git push
